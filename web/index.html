<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>SANCTUM</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0f14;--panel:#111821;--line:#253041;--text:#e7edf5;--muted:#8fa0b5;--accent:#74c7ec;--ok:#93e2a3}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
    main{max-width:1040px;margin:auto;padding:24px 16px 80px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}
    h1{font-size:22px;margin:0;letter-spacing:.08em}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--ok)}
    .grid{display:grid;grid-template-columns:1.5fr .8fr;gap:14px}@media(max-width:820px){.grid{grid-template-columns:1fr}}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
    textarea,input,select,button{width:100%;background:#0d131b;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}
    textarea{min-height:150px;resize:vertical}.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}button{cursor:pointer;background:#142233;border-color:#2d4965}button:hover{border-color:var(--accent)}
    .answer{white-space:pre-wrap;line-height:1.55}.meta{font-size:12px;color:var(--muted);margin:10px 0}.hidden{display:none}
    details{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}summary{cursor:pointer;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere}
    .small{font-size:12px;color:var(--muted)}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  </style>
</head>
<body>
<main>
  <div class="top"><h1>PERSONAL LLM SANCTUM</h1><div id="status" class="status">checking runtime…</div></div>
  <div class="grid">
    <section class="card">
      <label for="prompt">Intent</label>
      <textarea id="prompt" placeholder="Ask SANCTUM…"></textarea>
      <div class="row">
        <select id="mode"><option value="auto">AUTO · adaptive compute</option><option value="fast">FAST · one model</option><option value="deliberate">DELIBERATE · council + verifier</option></select>
        <button id="send">Execute</button>
      </div>
      <div id="runMeta" class="meta"></div>
      <div id="answer" class="answer"></div>
      <details id="traceBox" class="hidden"><summary>Execution trace</summary><pre id="trace"></pre></details>
    </section>
    <aside class="card">
      <strong>Memory</strong>
      <p class="small">Explicit memory only. Add information you want SANCTUM to retrieve later.</p>
      <label for="memory">Content</label><textarea id="memory" style="min-height:100px"></textarea>
      <label for="tags">Tags</label><input id="tags" placeholder="project architecture preference" />
      <button id="saveMemory" style="margin-top:10px">Save memory</button>
      <div id="memoryStatus" class="meta"></div>
      <details><summary>Available models</summary><pre id="models">loading…</pre></details>
    </aside>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
